name: RECLAIM preview checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: title-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # Exactly matches package-lock.json. Browser/native dependencies are already
    # installed; host apt/service updates must not consume the test budget.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: chromium-ui
            browser: chromium
            tests: tests/home-v2.spec.mjs tests/home.spec.mjs tests/ui.spec.mjs tests/reference-menus.spec.mjs
          - suite: chromium-world
            browser: chromium
            tests: tests/mission.spec.mjs tests/area-preview.spec.mjs
          - suite: iphone-webkit
            browser: webkit
            tests: tests/ios.spec.mjs
          - suite: mobile-chromium
            browser: chromium
            tests: tests/mobile-reference.spec.mjs
          - suite: mobile-webkit
            browser: webkit
            tests: tests/mobile-reference.spec.mjs
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Trust only this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify pinned native browser and Japanese fonts
        env:
          REVIEW_BROWSER: ${{ matrix.browser }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {chromium,webkit} from 'playwright'; const v=JSON.parse(fs.readFileSync('node_modules/playwright/package.json','utf8')).version; if(v!=='1.64.0') throw Error('Update the pinned CI image with Playwright: '+v); fs.accessSync(({chromium,webkit})[process.env.REVIEW_BROWSER].executablePath());"
          test -n "$(fc-list :lang=ja | head -n 1)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:blender
      - run: node --experimental-strip-types tools/blender/export_world_contract.mjs --check
      - run: npm run build
      - run: npm run package:preview
        env:
          RECLAIM_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Existing PC, world and iPhone regression suites
        if: ${{ !startsWith(matrix.suite, 'mobile-') }}
        run: npm run test:e2e -- ${{ matrix.tests }} --project=${{ matrix.suite == 'iphone-webkit' && 'iphone-webkit' || 'chromium' }}
      - name: Mobile 2D touch and failure-mode gates
        if: ${{ startsWith(matrix.suite, 'mobile-') }}
        run: npx playwright test --config=scripts/mobile-playwright.config.mjs --project=${{ matrix.suite }}
      - name: Read approved main PC baseline
        if: matrix.suite == 'chromium-ui'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: pc-reference-baseline
          persist-credentials: false
      - name: Build unchanged PC baseline
        if: matrix.suite == 'chromium-ui'
        working-directory: pc-reference-baseline
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/pc-reference-baseline"
          npm ci
          npm run build
          npm run package:preview
        env:
          RECLAIM_BUILD_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Exact main-to-candidate PC pixels at five viewports
        if: matrix.suite == 'chromium-ui'
        run: node scripts/compare-pc-reference.mjs pc-reference-baseline/release/RECLAIM_PC_Menu_Preview.html release/RECLAIM_Mobile_Menu_Preview.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reclaim-preview-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/
            release/
            package-lock.json
          retention-days: 7
