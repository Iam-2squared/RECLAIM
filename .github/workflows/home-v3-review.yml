name: HOME V3 review workspace
on:
  push:
    branches: [feature/home-v3-cinematic]
    paths: [.github/workflows/home-v3-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: |
          mkdir -p /tmp/reclaim-review
          git rev-parse HEAD > /tmp/reclaim-review/source-head.txt
          git archive HEAD > /tmp/reclaim-review/source.tar
          tar -czf /tmp/reclaim-review/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: reclaim-home-v3-workspace
          path: /tmp/reclaim-review/
          retention-days: 2
